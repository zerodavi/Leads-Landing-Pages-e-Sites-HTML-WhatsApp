<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d1a">
<title>Bolinha Soridente ⚽😊</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  *, *::before, *::after {
    margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }

  html {
    height:100%; height:100dvh;
    background:#0d0d1a;
    overflow:hidden;
  }

  body {
    height:100%; height:100dvh;
    background:#0d0d1a;
    font-family:'Fredoka One',cursive;
    overflow:hidden;
    touch-action:none;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }

  /* ══════════════════════════
     WRAPPER: 3 linhas fixas
     HUD | CANVAS | CONTROLES
  ══════════════════════════ */
  #game-wrapper {
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    gap:0;
  }

  /* ── HUD: fixo no topo, altura automática ── */
  #hud {
    flex:0 0 auto;
    width:100%;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    background:rgba(255,255,255,0.05);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:5px 10px;
    /* safe area top (notch) */
    padding-top:max(5px, env(safe-area-inset-top));
  }
  .hud-item {
    display:flex; align-items:center; gap:5px;
    color:#fff; font-size:0.9rem;
    white-space:nowrap;
  }
  .hud-item .label {
    color:#888; font-size:0.65rem;
    font-family:'Nunito',sans-serif;
    text-transform:uppercase;
  }
  .hud-item .val { font-size:1rem; color:#ffe566; }
  #lives-display { display:flex; gap:3px; }
  .heart { font-size:0.95rem; line-height:1; }
  .heart.lost { filter:grayscale(1); opacity:0.3; }
  #skin-badge {
    font-size:0.82rem; padding:3px 11px; border-radius:20px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    color:#ddd; font-family:'Nunito',sans-serif; font-weight:700;
    white-space:nowrap;
  }
  #mute-btn, #pause-btn, #exit-btn {
    background:rgba(255,255,255,0.08) !important;
    border:1px solid rgba(255,255,255,0.15) !important;
    color:#fff !important; border-radius:50% !important;
    width:34px !important; height:34px !important;
    font-size:1rem !important; cursor:pointer;
    display:flex !important; align-items:center !important;
    justify-content:center !important; padding:0 !important;
    flex-shrink:0 !important;
  }
  #exit-btn { text-decoration:none; }
  #exit-btn:active { background:rgba(255,68,102,0.35) !important; }
  #pause-btn { display:none !important; }
  #pause-btn.visible { display:flex !important; }

  /* ── CANVAS AREA: ocupa todo espaço restante ── */
  #canvas-outer {
    flex:1 1 0;
    min-height:0;
    width:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  #canvas-scaler {
    position:relative;
    transform-origin:top center;
    flex-shrink:0;
    /* JS sets margin-top to nudge down */
  }
  #canvas {
    display:block;
    border-radius:10px;
    border:2px solid rgba(255,255,255,0.12);
    box-shadow:0 0 40px rgba(80,200,255,0.12),0 0 80px rgba(255,200,80,0.06);
    touch-action:none;
  }
  #overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.92); border-radius:10px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start;
    gap:5px; z-index:10; backdrop-filter:blur(4px);
    padding:8px 10px 10px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #overlay h1 {
    font-size:clamp(1.4rem,5vw,2.2rem); color:#ffe566;
    text-shadow:0 0 30px #ffb800,0 4px 0 #a07000;
    animation:bounce 0.8s infinite alternate;
  }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-8px)} }
  #overlay .subtitle {
    color:#aaa; font-family:'Nunito',sans-serif;
    font-size:clamp(0.7rem,2.2vw,0.85rem); text-align:center;
  }
  #skin-section h3 {
    color:#888; font-size:0.65rem; letter-spacing:2px;
    font-family:'Nunito',sans-serif; font-weight:900;
    text-align:center; margin-bottom:4px;
  }
  #skin-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
  .skin-card {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:5px 3px 4px; border-radius:10px; cursor:pointer;
    border:2px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03);
    transition:all 0.15s; user-select:none;
  }
  .skin-card:active { background:rgba(255,255,255,0.09); transform:translateY(-2px); }
  .skin-card.selected {
    border-color:#ffe566; background:rgba(255,229,102,0.1);
    box-shadow:0 0 14px rgba(255,200,0,0.25); transform:translateY(-2px);
  }
  .skin-card canvas { border-radius:50%; display:block; }
  .skin-label { font-size:0.62rem; color:#bbb; font-family:'Nunito',sans-serif; font-weight:700; text-align:center; }
  .skin-tag { font-size:0.52rem; color:#666; font-family:'Nunito',sans-serif; text-align:center; }
  .skin-card.selected .skin-label { color:#ffe566; }

  /* ── Skin bloqueada ── */
  .skin-card.locked {
    opacity:0.55;
    cursor:default;
    border-color:rgba(255,255,255,0.04);
    position:relative;
    overflow:hidden;
  }
  .skin-card.locked canvas { filter:grayscale(1) brightness(0.5); }
  .skin-card.locked .skin-label { color:#666; }
  .skin-card.locked .skin-tag  { color:#555; }
  .skin-lock-overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.55); border-radius:9px; gap:1px;
  }
  .skin-lock-icon  { font-size:1.1rem; line-height:1; }
  .skin-lock-pts   {
    font-size:0.56rem; color:#ffcc44;
    font-family:'Nunito',sans-serif; font-weight:900;
    text-align:center; line-height:1.2;
  }

  /* ── Progresso total ── */
  #total-score-bar {
    width:100%; text-align:center;
    font-family:'Nunito',sans-serif; font-size:0.7rem; color:#666;
    padding:2px 0 0;
    flex-shrink:0;
  }
  #total-score-bar span { color:#ffe566; font-weight:900; }

  #start-btn {
    background:linear-gradient(135deg,#ffb800,#ff6b00); color:#fff; border:none;
    border-radius:50px; padding:10px 32px; font-family:'Fredoka One',cursive;
    font-size:1.15rem; cursor:pointer;
    box-shadow:0 5px 0 #8b3a00,0 0 24px rgba(255,180,0,0.35);
    transition:transform 0.1s,box-shadow 0.1s; letter-spacing:1px; flex-shrink:0;
  }
  #start-btn:active { transform:translateY(3px); box-shadow:0 2px 0 #8b3a00; }

  /* PC controls hint */
  #controls-hint {
    display:none; /* hidden by default; JS shows on desktop */
    gap:10px; font-family:'Nunito',sans-serif; font-size:0.7rem; color:#555;
    flex-wrap:wrap; justify-content:center;
    flex:0 0 auto; padding:4px 0;
  }
  .key-hint { background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:5px; border:1px solid #2a2a2a; }

  /* ═══════════════════════════════
     CONTROLES MOBILE (Android)
     Fixos na base, altura fixa
  ═══════════════════════════════ */
  #mobile-controls {
    flex:0 0 auto;
    display:none; /* JS mostra em touch */
    width:100%;
    padding:4px 12px max(4px, env(safe-area-inset-bottom));
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.3);
    border-top:1px solid rgba(255,255,255,0.06);
  }
  #mobile-controls.visible { display:flex; }

  .ctrl-group { display:flex; gap:8px; align-items:center; }

  .ctrl-btn {
    width:58px; height:58px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.07);
    color:#fff; font-size:1.4rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    transition:background 0.07s, border-color 0.07s, transform 0.07s;
    box-shadow:0 3px 0 rgba(0,0,0,0.5);
    flex-shrink:0;
  }
  .ctrl-btn.pressed, .ctrl-btn:active {
    background:rgba(255,255,255,0.2);
    border-color:rgba(255,255,255,0.7);
    transform:scale(0.90) translateY(2px);
    box-shadow:0 1px 0 rgba(0,0,0,0.5);
  }
  #btn-left, #btn-right {
    border-color:rgba(80,180,255,0.5);
    background:rgba(40,100,200,0.10);
  }
  #btn-left.pressed, #btn-left:active,
  #btn-right.pressed, #btn-right:active {
    border-color:rgba(80,180,255,1);
    background:rgba(80,180,255,0.22);
  }
  #btn-jump {
    width:64px; height:64px; font-size:1.6rem;
    border-color:rgba(255,200,40,0.55);
    background:rgba(255,170,0,0.12);
  }
  #btn-jump.pressed, #btn-jump:active {
    background:rgba(255,170,0,0.30);
    border-color:rgba(255,210,40,1);
    box-shadow:0 1px 0 rgba(0,0,0,0.5), 0 0 28px rgba(255,200,40,0.6);
  }
  #btn-shoot {
    width:60px; height:60px; font-size:1.45rem;
    border-color:rgba(255,70,110,0.55);
    background:rgba(220,40,80,0.12);
  }
  #btn-shoot.pressed, #btn-shoot:active {
    background:rgba(220,40,80,0.30);
    border-color:rgba(255,70,110,1);
    box-shadow:0 1px 0 rgba(0,0,0,0.5), 0 0 28px rgba(255,70,110,0.6);
  }

  .ctrl-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .ctrl-lbl {
    font-family:'Nunito',sans-serif; font-size:0.52rem;
    color:#555; letter-spacing:1px; text-transform:uppercase;
  }

  /* ═══════════════════════════════
     MODO PAISAGEM MOBILE — fullscreen
  ═══════════════════════════════ */
  #game-wrapper.landscape-full {
    position:fixed; inset:0;
  }
  #game-wrapper.landscape-full #hud {
    position:absolute; top:0; left:0; right:0; z-index:20;
    background:rgba(0,0,0,0.45);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:3px 10px;
    padding-top:max(3px, env(safe-area-inset-top));
    flex:none;
    gap:8px;
  }
  #game-wrapper.landscape-full #canvas-outer {
    position:fixed; inset:0;
    height:100vh !important;
    height:100dvh !important;
    align-items:center;
  }
  #game-wrapper.landscape-full #mobile-controls {
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    background:rgba(0,0,0,0.35);
    border-top:1px solid rgba(255,255,255,0.06);
    padding:3px 16px max(3px, env(safe-area-inset-bottom));
  }
  #game-wrapper.landscape-full #mobile-controls.visible {
    display:flex;
  }
  /* Botões menores em paisagem para não cobrir o jogo */
  #game-wrapper.landscape-full .ctrl-btn {
    width:50px; height:50px; font-size:1.2rem;
  }
  #game-wrapper.landscape-full #btn-jump {
    width:56px; height:56px; font-size:1.4rem;
  }
  #game-wrapper.landscape-full #btn-shoot {
    width:52px; height:52px; font-size:1.25rem;
  }
  #game-wrapper.landscape-full .hud-item { font-size:0.8rem; }
  #game-wrapper.landscape-full .hud-item .val { font-size:0.9rem; }
  #game-wrapper.landscape-full .hud-item .label { font-size:0.58rem; }
  #game-wrapper.landscape-full #skin-badge { font-size:0.72rem; padding:2px 8px; }
  #game-wrapper.landscape-full #mute-btn,
  #game-wrapper.landscape-full #pause-btn {
    width:28px !important; height:28px !important; font-size:0.85rem !important;
  }
  /* Remove retângulo visível do canvas em paisagem */
  #game-wrapper.landscape-full #canvas {
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
  }
  #game-wrapper.landscape-full #canvas-outer {
    background:transparent !important;
  }
  #game-wrapper.landscape-full #canvas-scaler {
    background:transparent !important;
  }
  /* Fundo do body igual ao céu do jogo para não aparecer borda lateral */
  #game-wrapper.landscape-full ~ * { background:#0d0d2a; }
  body.landscape-mode { background:#0d0d2a !important; }

  /* Botões menores em telas muito pequenas */
  @media (max-width:360px) {
    .ctrl-btn { width:56px; height:56px; font-size:1.4rem; }
    #btn-jump { width:62px; height:62px; font-size:1.55rem; }
    #btn-shoot { width:58px; height:58px; font-size:1.45rem; }
    .ctrl-group { gap:8px; }
  }
  /* Botões maiores em tablets */
  @media (min-width:600px) and (max-width:1024px) {
    .ctrl-btn { width:80px; height:80px; font-size:2rem; }
    #btn-jump { width:88px; height:88px; font-size:2.1rem; }
    #btn-shoot { width:84px; height:84px; font-size:1.95rem; }
    .ctrl-group { gap:18px; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="hud">
    <div class="hud-item"><span class="label">PONTOS</span><span class="val" id="score-val">0</span></div>
    <div class="hud-item"><span class="label">NÍVEL</span><span class="val" id="level-val">1</span></div>
    <div class="hud-item"><span class="label">VIDAS</span><div id="lives-display"></div></div>
    <div id="skin-badge">😊 Clássico</div>
    <button id="mute-btn" onclick="toggleMute()" title="Som on/off">🔊</button>
    <button id="pause-btn" onclick="togglePause()" title="Pausar">⏸️</button>
    <a id="exit-btn" href="index.html" onclick="return exitGame(event)" title="Sair para o portfólio" aria-label="Sair para o portfólio">🚪</a>
  </div>

  <div id="canvas-outer">
    <div id="canvas-scaler">
      <canvas id="canvas" width="800" height="400"></canvas>
      <div id="overlay">
        <h1>😊 Bolinha!</h1>
        <div class="subtitle">Pule sobre inimigos ou ataque com projéteis!</div>
        <div id="skin-section">
          <h3>✦ ESCOLHA SEU PERSONAGEM ✦</h3>
          <div id="total-score-bar">🏆 Total acumulado: <span id="total-val">0</span> pts</div>
          <div id="skin-grid"></div>
        </div>
        <button id="start-btn">▶ JOGAR</button>
        <div style="font-family:'Nunito',sans-serif;font-size:0.7rem;color:#444;">
          ← → Mover &nbsp;|&nbsp; ↑/Espaço Pular (2×) &nbsp;|&nbsp; Z Atacar
        </div>
      </div>
    </div>
  </div>

  <!-- PC hint -->
  <div id="controls-hint">
    <span class="key-hint">← → Mover</span>
    <span class="key-hint">↑ / Espaço — Pular</span>
    <span class="key-hint">Z — Atacar</span>
    <span class="key-hint">Duplo Pulo ↑↑</span>
  </div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <!-- Left side: D-pad movement -->
    <div class="ctrl-group">
      <div class="ctrl-wrap">
        <div class="ctrl-btn" id="btn-left">◀</div>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-btn" id="btn-right">▶</div>
      </div>
    </div>
    <!-- Right side: action buttons -->
    <div class="ctrl-group">
      <div class="ctrl-wrap">
        <div class="ctrl-btn" id="btn-shoot">💥</div>
      </div>
      <div class="ctrl-wrap">
        <div class="ctrl-btn" id="btn-jump">⬆️</div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════
//  RESPONSIVE CANVAS
// ══════════════════════════════
const GAME_W = 800, GAME_H = 400;
let scaleFactor = 1;

function isTouchDevice(){
  return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
}

function isLandscapeMobile(){
  return isTouchDevice() && window.innerWidth > window.innerHeight;
}

function resizeCanvas(){
  const hud  = document.getElementById('hud');
  const mc   = document.getElementById('mobile-controls');
  const hint = document.getElementById('controls-hint');
  const wrapper = document.getElementById('game-wrapper');

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if(isLandscapeMobile()){
    // MODO PAISAGEM: canvas ocupa 100% da tela, HUD e controles ficam em overlay
    wrapper.classList.add('landscape-full');
    document.body.classList.add('landscape-mode');

    // Mede as sobreposições (depois de aplicar a classe)
    const hudH  = hud  ? hud.getBoundingClientRect().height : 0;
    const ctrlH = (mc && mc.classList.contains('visible'))
                    ? mc.getBoundingClientRect().height : 0;

    // Disponível em altura considerando apenas as faixas sobrepostas
    // O canvas vai de fullscreen menos as bandas visíveis de HUD e controles
    const availH = vh;   // fullscreen total
    const availW = vw;

    const scaleW = availW / GAME_W;
    const scaleH = availH / GAME_H;
    scaleFactor  = Math.min(scaleW, scaleH);

    const scaler = document.getElementById('canvas-scaler');
    scaler.style.width     = GAME_W + 'px';
    scaler.style.height    = GAME_H + 'px';
    scaler.style.transform = `scale(${scaleFactor})`;
    scaler.style.marginTop = '0px';

    const outer = document.getElementById('canvas-outer');
    outer.style.height = ''; // deixa o CSS fixed controlar

  } else {
    // MODO RETRATO / DESKTOP: layout normal em colunas
    wrapper.classList.remove('landscape-full');
    document.body.classList.remove('landscape-mode');

    const hudH  = hud  ? hud.getBoundingClientRect().height : 0;
    const ctrlH = (mc && mc.classList.contains('visible'))
                    ? mc.getBoundingClientRect().height : 0;
    const hintH = (hint && hint.style.display !== 'none')
                    ? hint.getBoundingClientRect().height : 0;

    const availH = vh - hudH - ctrlH - hintH - 2;
    const availW = vw;

    const scaleW = availW / GAME_W;
    const scaleH = availH / GAME_H;
    const isMob  = isTouchDevice();
    scaleFactor  = isMob ? Math.min(scaleW, scaleH) : Math.min(scaleW, scaleH, 1.0);

    const scaler = document.getElementById('canvas-scaler');
    scaler.style.width     = GAME_W + 'px';
    scaler.style.height    = GAME_H + 'px';
    scaler.style.transform = `scale(${scaleFactor})`;
    scaler.style.marginTop = '0px';

    const outer = document.getElementById('canvas-outer');
    outer.style.height = Math.ceil(GAME_H * scaleFactor) + 'px';
  }
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
// Also fire after fonts/layout settle
setTimeout(resizeCanvas, 100);

// Detect touch/mobile - use touch capability, not screen width
function isMobile(){
  return isTouchDevice();
}
function updateMobileControls(){
  const mc   = document.getElementById('mobile-controls');
  const hint = document.getElementById('controls-hint');
  if(isMobile()){
    mc.classList.add('visible');
    if(hint) hint.style.display = 'none';
  } else {
    mc.classList.remove('visible');
    if(hint) hint.style.display = 'flex';
  }
  // Recalculate canvas after controls visibility changes
  resizeCanvas();
}
window.addEventListener('resize', updateMobileControls);
updateMobileControls();

// ══════════════════════════════
//  SISTEMA DE ÁUDIO
// ══════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgmNodes = [];
let bgmGain = null;
let audioEnabled = false;
let bgmInterval = null;
let bgmStep = 0;

async function initAudio(){
  if(audioCtx) return;
  audioCtx = new AudioCtx();
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  audioEnabled = true;
}

function makeGain(vol=1){
  const g = audioCtx.createGain();
  g.gain.value = vol;
  g.connect(audioCtx.destination);
  return g;
}

function osc(type, freq, start, dur, vol=0.4, dest=null){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  o.connect(g);
  g.connect(dest || audioCtx.destination);
  o.start(start);
  o.stop(start + dur + 0.01);
  return {o, g};
}

function noise(start, dur, vol=0.15, filter=null, dest=null){
  if(!audioCtx) return;
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  src.connect(g);
  if(filter){
    const f = audioCtx.createBiquadFilter();
    f.type = filter.type || 'bandpass';
    f.frequency.value = filter.freq || 800;
    f.Q.value = filter.Q || 1;
    g.connect(f);
    f.connect(dest || audioCtx.destination);
  } else {
    g.connect(dest || audioCtx.destination);
  }
  src.start(start);
  return src;
}

function playSound(key, volume=1, rate=1){
  if(!audioEnabled || !audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const v = volume * (muted ? 0 : 1);

  if(key === 'jump'){
    const baseFreq = 180 * rate;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(baseFreq, t);
    o.frequency.exponentialRampToValueAtTime(baseFreq * 3.2, t + 0.12);
    g.gain.setValueAtTime(v * 0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
    noise(t, 0.04, v * 0.08, {type:'highpass', freq:3000, Q:0.5});
  }
  else if(key === 'shoot'){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(900 * rate, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.14);
    g.gain.setValueAtTime(v * 0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.15);
    noise(t, 0.03, v * 0.12, {type:'highpass', freq:5000, Q:1});
  }
  else if(key === 'hit'){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(280, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
    g.gain.setValueAtTime(v * 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.11);
    noise(t, 0.06, v * 0.18, {type:'bandpass', freq:1200, Q:2});
  }
  else if(key === 'kill'){
    noise(t, 0.18, v * 0.22, {type:'lowpass', freq:500, Q:0.8});
    noise(t, 0.08, v * 0.15, {type:'highpass', freq:2000, Q:1});
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => { osc('triangle', freq, t + i*0.045, 0.09, v * 0.22); });
  }
  else if(key === 'damage'){
    const o = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    const g = audioCtx.createGain();
    lfo.frequency.value = 22;
    lfoGain.gain.value = 80;
    lfo.connect(lfoGain);
    lfoGain.connect(o.frequency);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(130, t);
    g.gain.setValueAtTime(v * 0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
    lfo.start(t); lfo.stop(t + 0.3);
    noise(t, 0.12, v * 0.2, {type:'bandpass', freq:400, Q:1.5});
  }
  else if(key === 'levelup'){
    const melody = [523,659,784,1047,1319];
    melody.forEach((freq, i) => {
      osc('square', freq, t + i*0.07, 0.12, v * 0.18);
      osc('triangle', freq*2, t + i*0.07, 0.08, v * 0.08);
    });
    noise(t + 0.3, 0.15, v * 0.1, {type:'highpass', freq:4000, Q:1});
  }
  else if(key === 'gameover'){
    const sad = [392, 330, 294, 220, 165];
    sad.forEach((freq, i) => {
      osc('sawtooth', freq, t + i*0.14, 0.2, v * 0.2);
      osc('sine', freq*0.5, t + i*0.14, 0.2, v * 0.1);
    });
    noise(t + 0.65, 0.3, v * 0.15, {type:'lowpass', freq:300, Q:0.6});
  }
  else if(key === 'land'){
    noise(t, 0.06, v * 0.18, {type:'lowpass', freq:400, Q:0.8});
    osc('sine', 100, t, 0.07, v * 0.25);
  }
  else if(key === 'stomp'){
    noise(t, 0.1, v * 0.25, {type:'lowpass', freq:600, Q:1});
    osc('sine', 200, t, 0.08, v * 0.35);
    osc('square', 400, t, 0.04, v * 0.15);
  }
  else if(key === 'select'){
    osc('sine', 880, t, 0.06, v * 0.15);
    osc('sine', 1320, t+0.05, 0.06, v * 0.12);
  }
}

const BGM_MELODY = [
  523,587,659,784,  659,587,523,494,
  523,587,659,784,  880,784,659,523,
  784,880,988,1047, 988,880,784,659,
  784,880,988,880,  784,659,587,523,
];
const BGM_BASS = [
  131,131,165,165,  131,131,110,110,
  131,131,165,165,  220,220,165,131,
  196,196,220,220,  196,196,165,165,
  196,196,220,196,  196,165,147,131,
];

function startBGM(){
  if(!audioEnabled || !audioCtx) return;
  stopBGM();
  bgmStep = 0;
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.22;
  masterGain.connect(audioCtx.destination);
  bgmGain = masterGain;

  function playStep(){
    if(!audioEnabled || muted) { bgmStep = (bgmStep+1) % BGM_MELODY.length; return; }
    const t = audioCtx.currentTime;
    const mel = BGM_MELODY[bgmStep];
    const bas = BGM_BASS[bgmStep];
    const mo = audioCtx.createOscillator();
    const mg = audioCtx.createGain();
    mo.type = 'square';
    mo.frequency.setValueAtTime(mel, t);
    mg.gain.setValueAtTime(0.12, t);
    mg.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    mo.connect(mg); mg.connect(masterGain);
    mo.start(t); mo.stop(t + 0.12);
    const bo = audioCtx.createOscillator();
    const bg2 = audioCtx.createGain();
    bo.type = 'triangle';
    bo.frequency.setValueAtTime(bas, t);
    bg2.gain.setValueAtTime(0.18, t);
    bg2.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    bo.connect(bg2); bg2.connect(masterGain);
    bo.start(t); bo.stop(t + 0.14);
    if(bgmStep % 4 === 0) noise(t, 0.06, 0.08, {type:'lowpass', freq:300, Q:0.5}, masterGain);
    if(bgmStep % 2 === 0) noise(t + 0.065, 0.03, 0.05, {type:'highpass', freq:3000, Q:0.5}, masterGain);
    bgmStep = (bgmStep+1) % BGM_MELODY.length;
  }

  playStep();
  bgmInterval = setInterval(playStep, 135);
}

function stopBGM(){
  if(bgmInterval){ clearInterval(bgmInterval); bgmInterval=null; }
  if(bgmGain){ try{ bgmGain.disconnect(); } catch(e){} bgmGain=null; }
}

let totalScore = parseInt(localStorage.getItem('bolinha_total') || '0', 10);

function saveTotal(){ localStorage.setItem('bolinha_total', totalScore); }

function isSkinUnlocked(skin){
  return skin.cost === 0 || totalScore >= skin.cost;
}
function isMapUnlocked(map){
  return !map.cost || map.cost === 0 || totalScore >= map.cost;
}

function addToTotal(pts){
  const before = totalScore;
  totalScore += pts;
  saveTotal();
  // retorna { skins, maps } recém-desbloqueados
  return {
    skins: SKINS.filter(s => s.cost > 0 && before < s.cost && totalScore >= s.cost),
    maps: Object.values(MAPS).filter(m => m.cost > 0 && before < m.cost && totalScore >= m.cost)
  };
}

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;

  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}

function drawSmiley(cx, x, y, r, facing, attacking, blinking, squish, skin, fh){

    g.addColorStop(.5,`hsl(${(hue+80)%360},100%,62%)`);
    g.addColorStop(1,`hsl(${(hue+160)%360},100%,42%)`);

    cx.shadowColor='#aa44ff'; cx.shadowBlur=16;
    cx.strokeStyle='rgba(180,100,255,.5)'; cx.lineWidth=2; cx.stroke(); cx.shadowBlur=0;

  } else if(skin.special==='vampire'){
    cx.fillStyle='#330011';

    cx.bezierCurveTo(-r*1.3,r*.5,-r*1.5,r*.05,-r*.75,-r*.35); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(r*.55,r*.18);
    cx.bezierCurveTo(r*1.3,r*.5,r*1.5,r*.05,r*.75,-r*.35); cx.closePath(); cx.fill();
    const g=cx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);

    g.addColorStop(0,skin.body[0]); g.addColorStop(.6,skin.body[1]); g.addColorStop(1,skin.body[2]);
    cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fillStyle=g; cx.fill();
    cx.strokeStyle=skin.outline; cx.lineWidth=2.5; cx.stroke(); cx.restore();
    cx.strokeStyle=skin.outline; cx.lineWidth=1.5;
    cx.beginPath(); cx.moveTo(-r*.25,-r); cx.lineTo(-r*.52,-r*1.48); cx.stroke();

    cx.globalAlpha=1;

    const g=cx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);

      fg.addColorStop(1,'rgba(255,255,0,0)');
      cx.beginPath();
      cx.moveTo(-r*.12,0);
      cx.quadraticCurveTo(r*.04*Math.sin(t+i),-fl*.5,0,-fl);
      cx.quadraticCurveTo(-r*.04*Math.sin(t+i),-fl*.5,r*.12,0);

        cx.globalAlpha=1; cx.shadowBlur=0;
      }
    }
  } else {
    cx.strokeStyle=skin.eye; cx.lineWidth=2;
    cx.beginPath();
    cx.moveTo(eox-r*.4*facing,eY); cx.lineTo(eox-r*.08*facing,eY);
    cx.moveTo(eox+r*.08*facing,eY); cx.lineTo(eox+r*.4*facing,eY);
    cx.stroke();
  }

  if(attacking){
    cx.beginPath(); cx.arc(0,r*.2,r*.32,0,Math.PI);
    cx.fillStyle=skin.mouth; cx.fill();
    cx.strokeStyle=skin.outline; cx.lineWidth=1.5; cx.stroke();
    cx.fillStyle=skin.teeth;
    if(skin.special==='vampire'){
      cx.beginPath(); cx.moveTo(-r*.26,r*.2); cx.lineTo(-r*.19,r*.37); cx.lineTo(-r*.12,r*.2); cx.fill();
      cx.beginPath(); cx.moveTo(r*.12,r*.2); cx.lineTo(r*.19,r*.37); cx.lineTo(r*.26,r*.2); cx.fill();
    } else if(skin.special==='robot'){
      for(let t=-1;t<=1;t++) cx.fillRect(t*r*.18-r*.09,r*.2,r*.14,r*.12);
    } else {
      cx.fillRect(-r*.28,r*.2,r*.18,r*.12);
      cx.fillRect(-r*.06,r*.2,r*.18,r*.12);
    }
  } else {
    cx.beginPath(); cx.arc(0,r*.09,r*.3,.2,Math.PI-.2);
    cx.strokeStyle=skin.mouth; cx.lineWidth=2.5; cx.stroke();
  }

  cx.globalAlpha=.2; cx.fillStyle=skin.cheek;
  cx.beginPath(); cx.ellipse(-r*.46,r*.1,r*.18,r*.1,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(r*.46,r*.1,r*.18,r*.1,0,0,Math.PI*2); cx.fill();
  cx.globalAlpha=1;
  cx.restore();
}

function buildSkinGrid(){
  const grid=document.getElementById('skin-grid');
  if(!grid) return;
  grid.innerHTML='';

  // Atualiza placar total
  const tv=document.getElementById('total-val');
  if(tv) tv.textContent=totalScore.toLocaleString('pt-BR');

  SKINS.forEach((skin,i)=>{
    const unlocked = isSkinUnlocked(skin);
    const card=document.createElement('div');
    card.className='skin-card'
      + (skin===selectedSkin?' selected':'')
      + (!unlocked?' locked':'');

    // Preview canvas
    const pc=document.createElement('canvas');
    pc.width=62; pc.height=62;
    const pcx=pc.getContext('2d');
    pcx.beginPath(); pcx.arc(31,31,29,0,Math.PI*2);
    pcx.fillStyle='rgba(255,255,255,0.05)'; pcx.fill();
    drawSmiley(pcx,31,40,22,1,false,false,1,skin,0);
    card.appendChild(pc);

    const lbl=document.createElement('div'); lbl.className='skin-label'; lbl.textContent=skin.name;
    const tag=document.createElement('div'); tag.className='skin-tag'; tag.textContent=skin.tag;
    card.appendChild(lbl); card.appendChild(tag);

    if(!unlocked){
      // Overlay de cadeado com custo
      const ov=document.createElement('div'); ov.className='skin-lock-overlay';
      const ic=document.createElement('div'); ic.className='skin-lock-icon'; ic.textContent='🔒';
      const pt=document.createElement('div'); pt.className='skin-lock-pts';
      pt.textContent=skin.cost.toLocaleString('pt-BR')+' pts';
      ov.appendChild(ic); ov.appendChild(pt);
      card.appendChild(ov);
    } else {
      card.addEventListener('click',()=>{
        if(!isSkinUnlocked(skin)) return;
        document.querySelectorAll('.skin-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        selectedSkin=skin;
        document.getElementById('skin-badge').textContent=skin.tag+' '+skin.name;
        playSound('select',0.6);
      });
    }

    grid.appendChild(card);
  });
}

// ══════════════════════════════
//  ENEMIES
// ══════════════════════════════
const ENEMY_TYPES=[
  {name:'basic', color:'#ff4466',eyeColor:'#fff',size:30,speed:2.2,hp:1,pts:10,jumps:false},
  {name:'fast',  color:'#ff9922',eyeColor:'#fff',size:24,speed:3.8,hp:1,pts:20,jumps:false},
  {name:'big',   color:'#aa44ff',eyeColor:'#fff',size:44,speed:1.4,hp:3,pts:50,jumps:false},
  {name:'jumper',color:'#22ddaa',eyeColor:'#111',size:28,speed:2.0,hp:1,pts:30,jumps:true},
];

function drawEnemy(e){
  const r=e.size/2;
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.scale(1/e.squish,e.squish);
  ctx.beginPath(); ctx.ellipse(0,r*.9,r*.7,r*.18,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fill();
  const c=e.type.color;
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
  g.addColorStop(0,lighten(c,60)); g.addColorStop(1,c);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=darken(c,40); ctx.lineWidth=2; ctx.stroke();
  for(let i=0;i<e.hp;i++){
    ctx.beginPath(); ctx.arc(-r*.35+i*r*.35,-r*1.12,5,0,Math.PI*2);
    ctx.fillStyle='#ff3355'; ctx.fill();
  }
  ctx.fillStyle=e.type.eyeColor;
  ctx.beginPath(); ctx.arc(-r*.25,-r*.2,r*.13,0,Math.PI*2);
  ctx.arc(r*.25,-r*.2,r*.13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-r*.25,-r*.16,r*.07,0,Math.PI*2);
  ctx.arc(r*.25,-r*.16,r*.07,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-r*.42,-r*.42); ctx.lineTo(-r*.1,-r*.34);
  ctx.moveTo(r*.42,-r*.42); ctx.lineTo(r*.1,-r*.34); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,r*.35,r*.25,Math.PI+.3,-.3);
  ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}

function spawnEnemy(){
  const lb=Math.min(level-1,5);
  const pool=lb>=2?ENEMY_TYPES:ENEMY_TYPES.slice(0,2+lb);
  const type=pool[randInt(0,pool.length-1)];
  enemies.push({
    x:W+type.size, y:GROUND, type,
    hp:type.hp, size:type.size,
    vx:-(type.speed+lb*.25), vy:0,
    onGround:true, jumpTimer:type.jumps?randInt(60,120):999999, squish:1,
  });
}

function fireProjectile(){
  if(player.attackTimer>0) return;
  player.attackTimer=22; player.attacking=true;
  projectiles.push({
    x:player.x+player.facing*(player.w/2+8),
    y:player.y-player.h/2,
    vx:player.facing*11, vy:-1, life:1, size:10,
    color:selectedSkin.proj, glow:selectedSkin.glow,
  });
  spawnParticles(player.x,player.y-player.h/2,selectedSkin.proj,5,4);
}

function resetGame(){

  player.x=120; player.y=GROUND; player.vx=0; player.vy=0;
  player.jumpsLeft=2; player.onGround=false; player.attacking=false;

// ══════════════════════════════
//  UPDATE
// ══════════════════════════════
function update(){
  frame++;

  player.vx=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']||keys['_left']){player.vx=-player.speed;player.facing=-1;}
  if(keys['ArrowRight']||keys['d']||keys['D']||keys['_right']){player.vx=player.speed;player.facing=1;}

  player.vy+=0.7; player.x+=player.vx; player.y+=player.vy;

  if(player.y>=GROUND){
    player.y=GROUND;
    if(!player.onGround){ player.squish=1.4; spawnParticles(player.x,GROUND+10,selectedSkin.proj,6,3); playSound('land',0.5); }
    player.vy=0; player.onGround=true; player.jumpsLeft=2;
  } else { player.onGround=false; }

  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  player.squish=lerp(player.squish,1,.15);
  if(player.attackTimer>0) player.attackTimer--; else player.attacking=false;
  if(player.invincible>0){ player.invincible--; player.blinking=Math.floor(player.invincible/5)%2===0; }
  else player.blinking=false;

  player.trail.push({x:player.x,y:player.y,t:1});
  if(player.trail.length>10) player.trail.shift();
  player.trail.forEach(t=>t.t-=0.1);

  projectiles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.012;});
  projectiles=projectiles.filter(p=>p.life>0&&p.x<W+20&&p.x>-20);

  enemySpawnTimer++;
  if(enemySpawnTimer>=enemySpawnInterval){
    enemySpawnTimer=0; spawnEnemy();
    if(enemySpawnInterval>40) enemySpawnInterval-=1.5;
  }

  enemies.forEach(e=>{
    e.x+=e.vx; e.vy+=0.7; e.y+=e.vy;
    if(e.y>=GROUND){e.y=GROUND;if(e.vy>2)e.squish=1.3;e.vy=0;e.onGround=true;} else e.onGround=false;
    e.jumpTimer--; if(e.jumpTimer<=0&&e.onGround){e.vy=-12;e.jumpTimer=randInt(60,140);}
    e.squish=lerp(e.squish,1,.15);

    projectiles.forEach((p,pi)=>{
      if(circleHit(p.x,p.y,p.size,e.x,e.y-e.size/2,e.size/2)){
        e.hp--;
        spawnParticles(e.x,e.y-e.size/2,e.type.color,8,5);
        projectiles.splice(pi,1);
        if(e.hp<=0){ floatText(e.x,e.y-e.size,'+'+e.type.pts); score+=e.type.pts; updateHUD(); playSound('kill',0.7); }
        else { floatText(e.x,e.y-e.size,'HIT!','#ff4466'); e.squish=0.6; playSound('hit',0.6); }
      }
    });

    const pr=player.w/2,er=e.size/2;
    if(circleHit(player.x,player.y-pr,pr,e.x,e.y-er,er)){
      if(player.vy>1&&player.y-pr<e.y-er){
        e.hp--; player.vy=-10; player.jumpsLeft=2;
        spawnParticles(e.x,e.y-er,e.type.color,12,7);
        if(e.hp<=0){ floatText(e.x,e.y-e.size,'STOMP! +'+(e.type.pts*2),'#ffe566'); score+=e.type.pts*2; playSound('stomp',0.9); playSound('kill',0.7); }
        else { floatText(e.x,e.y-e.size,'STOMP!','#ff9922'); e.squish=0.5; playSound('stomp',0.7); playSound('hit',0.5); }
        updateHUD();
      } else if(player.invincible<=0){
        lives--; player.invincible=90;
        spawnParticles(player.x,player.y-pr,'#ff4466',15,8);
        playSound('damage',0.8);
        if(lives<=0){state='gameover';showGameOver();stopBGM();playSound('gameover',0.9);} updateHUD();
      }
    }
  });
  enemies=enemies.filter(e=>e.hp>0&&e.x>-80);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=p.decay;p.size*=.97;});
  particles=particles.filter(p=>p.life>0);
  floatingTexts.forEach(t=>{t.y+=t.vy;t.life-=.02;});
  floatingTexts=floatingTexts.filter(t=>t.life>0);

  const nl=Math.floor(score/200)+1;
  if(nl>level){
    level=nl;
    spawnParticles(W/2,H/2,'#ffe566',30,10);
    floatText(W/2,H/2-40,'⭐ NÍVEL '+level+' ⭐','#ffe566');
    playSound('levelup',0.8);
    updateHUD();
  }
  stars.forEach(s=>s.twinkle+=.05);
}

// ══════════════════════════════
//  DRAW
// ══════════════════════════════
function draw(){
  // Cada mapa desenha seu próprio fundo completo
  MAPS[currentMap].drawBg(ctx, frame);

  player.trail.forEach((t,i)=>{
    const a=t.t*.28; if(a<=0)return;
    ctx.beginPath();
    ctx.arc(t.x,t.y-player.h/2,(player.w/2)*(i/player.trail.length),0,Math.PI*2);
    ctx.fillStyle=`rgba(${selectedSkin.trail},${a})`; ctx.fill();
  });

  if(!player.blinking){
    drawSmiley(ctx,player.x,player.y-player.h/2,player.w/2,
      player.facing,player.attacking,false,player.squish,selectedSkin,frame);
  }

  if(!player.onGround){
    ctx.beginPath();
    ctx.arc(player.x,player.y-player.h/2,player.w/2+7,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${selectedSkin.trail},.35)`;
    ctx.lineWidth=3; ctx.stroke();
  }

  projectiles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life;
    const pg=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.size);
    pg.addColorStop(0,'#fff'); pg.addColorStop(.5,p.color); pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=pg; ctx.shadowColor=p.glow; ctx.shadowBlur=18; ctx.fill();
    ctx.restore();
  });

  enemies.forEach(e=>drawEnemy(e));

  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill(); ctx.restore();
  });

  floatingTexts.forEach(t=>{
    ctx.save(); ctx.globalAlpha=t.life;
    ctx.font='bold 18px Fredoka One,cursive'; ctx.fillStyle=t.color;
    ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=6;
    ctx.fillText(t.text,t.x,t.y); ctx.restore();
  });
  ctx.textAlign='left';
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  // Pause / resume
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(state==='play'||state==='paused'){ togglePause(); e.preventDefault(); }
    return;
  }
  if(state!=='play') return;
  if((e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')&&player.jumpsLeft>0){
    player.vy=player.jumpForce; player.jumpsLeft--;
    player.squish=0.65;
    spawnParticles(player.x,player.y,selectedSkin.proj+'88',6,3);
    playSound('jump', 0.6, player.jumpsLeft===0 ? 1.3 : 1.0);
    e.preventDefault();
  }
  if(e.key==='z'||e.key==='Z'){ fireProjectile(); playSound('shoot', 0.5); }
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// ══════════════════════════════
//  MOBILE BUTTON CONTROLS (Android)
// ══════════════════════════════
// Track active touches per button for reliable multi-touch
const btnTouches = {};

function setupMobileBtn(id, keyName, onPress, onRelease){
  const btn = document.getElementById(id);
  if(!btn) return;

  function press(e){
    e.preventDefault();
    e.stopPropagation();
    if(onPress){
      onPress();
    } else {
      keys[keyName] = true;
      btn.classList.add('pressed');
    }
  }
  function release(e){
    e.preventDefault();
    if(!onPress){
      keys[keyName] = false;
      btn.classList.remove('pressed');
    }
    if(onRelease) onRelease();
  }

  // Touch events (Android multi-touch safe)
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('touchend', release, {passive:false});
  btn.addEventListener('touchcancel', release, {passive:false});

  // Mouse fallback for PC testing
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
}

// Movement buttons: held = continuous
setupMobileBtn('btn-left',  '_left');
setupMobileBtn('btn-right', '_right');

// Jump button: trigger on each press (supports double-jump)
setupMobileBtn('btn-jump', null, ()=>{
  if(state!=='play') return;
  if(player.jumpsLeft>0){
    player.vy=player.jumpForce; player.jumpsLeft--;
    player.squish=0.65;
    spawnParticles(player.x,player.y,selectedSkin.proj+'88',6,3);
    playSound('jump', 0.6, player.jumpsLeft===0 ? 1.3 : 1.0);
    const btn = document.getElementById('btn-jump');
    btn.classList.add('pressed');
    setTimeout(()=>btn.classList.remove('pressed'), 150);
  }
});

// Shoot button: trigger on press
setupMobileBtn('btn-shoot', null, ()=>{
  if(state!=='play') return;
  fireProjectile(); playSound('shoot', 0.5);
  const btn = document.getElementById('btn-shoot');
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'), 150);
});

      drawLavaRiver(W * 0.44, GROUND - 125, W * 0.32, GROUND - 55, W * 0.18, GROUND, 10);

        ctx.fillStyle = i % 2 ? '#3a2010' : '#2a1808';
        ctx.beginPath();
        ctx.arc(rx, ry, size, 0, Math.PI * 2);
        ctx.fill();
        // brilho de lava na rocha
        if (i % 3 === 0) {

      for (let i = 0; i < 16; i++) {

      ctx.fillRect(0, GROUND, W, H - GROUND);

      // Superfície irregular
      ctx.fillStyle = '#2a1810';
      ctx.beginPath();
      ctx.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 20) {

      ctx.lineTo(W, GROUND + 15);
      ctx.lineTo(0, GROUND + 15);
      ctx.fill();

      // Rachaduras brilhantes de lava
      const crackAlpha = 0.45 + 0.35 * Math.sin(frame * 0.1);
      ctx.strokeStyle = `rgba(255,90,10,${crackAlpha})`;

      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 10;
      const cracks = [
        [40, 8, 55, 22, 48, 38],
        [180, 5, 200, 20, 190, 42],
        [320, 10, 340, 28, 330, 45],
        [480, 6, 500, 24, 490, 40],
        [620, 8, 640, 26, 630, 44],
        [720, 5, 740, 20, 730, 38]

      cracks.forEach((c, i) => {
        const wobble = Math.sin(frame * 0.08 + i) * 3;
        ctx.beginPath();
        ctx.moveTo(c[0] + wobble, GROUND + c[1]);

        pg.addColorStop(0.5, `rgba(255,80,0,${pulse * 0.7})`);
        pg.addColorStop(1, 'rgba(100,20,0,0)');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.ellipse(lx, GROUND + 22, 18, 7, 0, 0, Math.PI * 2);

      ctx.beginPath();
      ctx.moveTo(0, GROUND + 1);
      ctx.lineTo(W, GROUND + 1);
      ctx.strokeStyle = `rgba(255,100,30,${0.3 + 0.2 * Math.sin(frame * 0.1)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

      const moons = [
        {x: 0.2, y: 40, r: 18, c: '#c0a0ff'},
        {x: 0.7, y: 55, r: 28, c: '#ffa0c0'},
        {x: 0.45, y: 30, r: 12, c: '#a0ffe0'}
      ];
      moons.forEach(m => {
        const mg = ctx.createRadialGradient(W * m.x - 5, m.y - 5, 2, W * m.x, m.y, m.r);
        mg.addColorStop(0, '#fff');
        mg.addColorStop(0.4, m.c);
        mg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(W * m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Estrelas
      stars.forEach(s => {
        const a = 0.3 + 0.5 * Math.sin(s.twinkle + frame * 0.03);
        ctx.beginPath();
        ctx.arc(s.x, s.y * 0.7, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,180,255,${a})`;
        ctx.fill();
      });

      // Plantas alienígenas
      const plants = [60, 180, 320, 480, 620, 740];
      plants.forEach((px0, i) => {
        const px = ((px0 - frame * 0.2) % (W + 60) + W + 60) % (W + 60) - 20;
        const pulse = 1 + 0.15 * Math.sin(frame * 0.06 + i);
        ctx.strokeStyle = `rgba(80,255,150,0.7)`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, GROUND);
        ctx.quadraticCurveTo(px + Math.sin(frame * 0.04 + i) * 15, GROUND - 40 * pulse, px, GROUND - 70 * pulse);
        ctx.stroke();
        // Cristal no topo
        ctx.fillStyle = `hsla(${280 + i * 30},80%,60%,0.8)`;
        ctx.beginPath();
        ctx.moveTo(px, GROUND - 70 * pulse - 12);
        ctx.lineTo(px - 8, GROUND - 70 * pulse);
        ctx.lineTo(px + 8, GROUND - 70 * pulse);
        ctx.fill();
      });

      // Cristais flutuantes
      for (let i = 0; i < 6; i++) {
        const cx = (i * 140 + 50 + Math.sin(frame * 0.02 + i) * 20) % W;
        const cy = 80 + Math.sin(frame * 0.03 + i * 1.3) * 30 + i * 10;
        ctx.fillStyle = `hsla(${260 + i * 25},90%,60%,0.5)`;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 10);
        ctx.lineTo(cx - 6, cy + 5);
        ctx.lineTo(cx + 6, cy + 5);
        ctx.fill();
      }

      // Partículas de energia
      for (let i = 0; i < 10; i++) {
        const px = (frame * 0.5 + i * 90) % W;
        const py = 50 + Math.sin(frame * 0.05 + i) * 50 + i * 12;
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,80,255,${0.4 + (i % 3) * 0.15})`;
        ctx.fill();
      }

      // Chão alienígena
      ctx.fillStyle = '#1a0a28';
      ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = '#2a1840';
      ctx.fillRect(0, GROUND, W, 6);
      ctx.beginPath();
      ctx.moveTo(0, GROUND + 1);
      ctx.lineTo(W, GROUND + 1);
      ctx.strokeStyle = 'rgba(160,60,255,0.5)';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#a040ff';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  },

  neonforest: {
    name: 'Floresta Neon',
    tag: '🌳',
    cost: 1800,
    bgColor: '#0a1a12',
    drawBg: function(ctx, frame) {
      const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
      sky.addColorStop(0, '#0a1520');
      sky.addColorStop(0.5, '#0a2018');
      sky.addColorStop(1, '#0a2815');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, GROUND);

      // Árvores bioluminescentes
      const trees = [
        {x: 40, h: 90}, {x: 120, h: 120}, {x: 220, h: 80},
        {x: 320, h: 140}, {x: 420, h: 100}, {x: 530, h: 125},
        {x: 640, h: 85}, {x: 730, h: 110}
      ];
      trees.forEach((t, i) => {
        const tx = ((t.x - frame * 0.25) % (W + 80) + W + 80) % (W + 80) - 30;
        const hue = (i * 45 + frame * 0.5) % 360;
        // Tronco
        ctx.fillStyle = '#1a2a20';
        ctx.fillRect(tx - 6, GROUND - t.h * 0.45, 12, t.h * 0.45);
        // Copa com glow
        ctx.shadowColor = `hsl(${hue},100%,50%)`;
        ctx.shadowBlur = 20;
        ctx.fillStyle = `hsla(${hue},90%,45%,0.85)`;
        ctx.beginPath();
        ctx.arc(tx, GROUND - t.h * 0.55, t.h * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(tx - t.h * 0.18, GROUND - t.h * 0.4, t.h * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(tx + t.h * 0.18, GROUND - t.h * 0.4, t.h * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Esporos / pólen luminoso
      for (let i = 0; i < 15; i++) {
        const px = (frame * (0.3 + i * 0.05) + i * 55) % W;
        const py = 40 + Math.sin(frame * 0.04 + i) * 40 + (i * 17) % 150;
        const hue = (i * 40 + frame) % 360;
        ctx.beginPath();
        ctx.arc(px, py, 1.5 + (i % 3) * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue},100%,70%,0.55)`;
        ctx.fill();
      }

      // Raios de luz
      ctx.strokeStyle = 'rgba(100,255,180,0.08)';
      ctx.lineWidth = 15;
      for (let i = 0; i < 4; i++) {
        const x = 100 + i * 180 + Math.sin(frame * 0.01 + i) * 30;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - 40, GROUND);
        ctx.stroke();
      }

      // Chão
      ctx.fillStyle = '#0a1a12';
      ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = '#1a3a22';
      ctx.fillRect(0, GROUND, W, 8);
      // Grama neon
      ctx.strokeStyle = 'rgba(0,255,120,0.5)';
      ctx.lineWidth = 1.5;
      for (let x = -((frame * 0.4) % 10); x < W; x += 10) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND + 2);
        ctx.lineTo(x + 1, GROUND - 5 - (x % 7));
        ctx.stroke();
      }
    }
  }
};

let currentMap = 'neon';

function drawClouds(ctx, frame) {
  const clouds = [
    { x: -100, y: 35, w: 130, speed: 0.28 },
    { x: 180, y: 70, w: 100, speed: 0.18 },
    { x: 380, y: 45, w: 150, speed: 0.22 },
    { x: 580, y: 90, w: 110, speed: 0.15 },
    { x: 750, y: 55, w: 120, speed: 0.25 },
  ];
  clouds.forEach(cloud => {
    const cloudX = ((cloud.x + frame * cloud.speed) % (W + 250) + W + 250) % (W + 250) - 80;
    drawCloud(ctx, cloudX, cloud.y, cloud.w);
  });
}

function drawCloud(ctx, x, y, w) {
  const h = w * 0.38;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.55, h, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - w * 0.32, y + 2, w * 0.38, h * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.3, y + 2, w * 0.4, h * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.05, y - h * 0.35, w * 0.3, h * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
}

function showMapSelection() {
  setPauseBtnVisible(false);
  const overlay = document.getElementById('overlay');
  const nextMap = Object.values(MAPS).find(m => !isMapUnlocked(m));
  const progressHTML = nextMap
    ? `<div style="font-family:'Nunito',sans-serif;font-size:0.65rem;color:#666;text-align:center;margin-bottom:6px;">
        Próximo mapa: ${nextMap.tag} ${nextMap.name} — faltam <span style="color:#ffe566;font-weight:900">${Math.max(0, nextMap.cost - totalScore).toLocaleString('pt-BR')} pts</span>
       </div>`
    : `<div style="font-family:'Nunito',sans-serif;font-size:0.65rem;color:#ffe566;text-align:center;margin-bottom:6px;">🏆 Todos os mapas desbloqueados!</div>`;

  overlay.innerHTML = `
    <h1 style="font-size:clamp(1.3rem,4.5vw,2rem); color:#ffe566; text-shadow:0 0 30px #ffb800,0 4px 0 #a07000; margin-bottom:6px;">⚽ Escolha um Mapa</h1>
    <div style="font-family:'Nunito',sans-serif;font-size:0.7rem;color:#888;margin-bottom:4px;">🏆 Total: <span style="color:#ffe566;font-weight:900">${totalScore.toLocaleString('pt-BR')}</span> pts</div>
    ${progressHTML}
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(95px,1fr)); gap:8px; width:100%; max-width:560px; padding:0 6px; max-height:45vh; overflow-y:auto;">
      ${Object.entries(MAPS).map(([key, map]) => {
        const unlocked = isMapUnlocked(map);
        return `
        <div class="map-card" data-map="${key}" style="
          padding:10px 6px; border-radius:12px; border:2.5px solid ${unlocked ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)'};
          background:rgba(255,255,255,0.05); cursor:${unlocked ? 'pointer' : 'default'}; transition:all 0.18s;
          text-align:center; user-select:none; position:relative; overflow:hidden;
          opacity:${unlocked ? '1' : '0.55'};
        ">
          <div style="font-size:2.1rem; margin-bottom:4px; line-height:1;${unlocked ? '' : 'filter:grayscale(1) brightness(0.6);'}">${map.tag}</div>
          <div style="font-family:'Nunito',sans-serif; font-size:0.88rem; color:${unlocked ? '#fff' : '#666'}; font-weight:700;">${map.name}</div>
          ${unlocked
            ? (map.cost === 0
                ? `<div style="font-family:'Nunito',sans-serif;font-size:0.58rem;color:#888;margin-top:2px;">⭐ Padrão</div>`
                : `<div style="font-family:'Nunito',sans-serif;font-size:0.58rem;color:#6a6;margin-top:2px;">✓ Liberado</div>`)
            : `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);border-radius:12px;gap:2px;">
                <div style="font-size:1.1rem;">🔒</div>
                <div style="font-family:'Nunito',sans-serif;font-size:0.58rem;color:#ffcc44;font-weight:900;">${map.cost.toLocaleString('pt-BR')} pts</div>
              </div>`
          }
        </div>`;
      }).join('')}
    </div>
  `;
  overlay.style.display = 'flex';

  document.querySelectorAll('.map-card').forEach(card => {
    const key = card.getAttribute('data-map');
    const map = MAPS[key];
    if (!isMapUnlocked(map)) return;

    card.addEventListener('click', () => selectMap(key));
    card.addEventListener('mouseover', function() {
      this.style.borderColor = '#ffe566';
      this.style.background = 'rgba(255,229,102,0.15)';
      this.style.transform = 'translateY(-4px)';
      this.style.boxShadow = '0 0 18px rgba(255,229,102,0.3)';
    });
    card.addEventListener('mouseout', function() {
      this.style.borderColor = 'rgba(255,255,255,0.12)';
      this.style.background = 'rgba(255,255,255,0.05)';
      this.style.transform = 'translateY(0)';
      this.style.boxShadow = 'none';
    });
    card.addEventListener('touchstart', function() {
      this.style.background = 'rgba(255,229,102,0.18)';
      this.style.borderColor = '#ffe566';
    }, {passive:true});
  });
}

function selectMap(mapKey) {
  if (!MAPS[mapKey] || !isMapUnlocked(MAPS[mapKey])) return;
  currentMap = mapKey;
  playSound('select', 0.5);
  showSkinSelection();
}

function showSkinSelection() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="font-size:clamp(1.4rem,5vw,2.2rem); color:#ffe566; text-shadow:0 0 30px #ffb800,0 4px 0 #a07000; margin-bottom:10px;">✦ ESCOLHA SUA SKIN ✦</h1>
    <div style="font-family:'Nunito',sans-serif; font-size:0.8rem; color:#aaa; margin-bottom:8px;">Mapa: ${MAPS[currentMap].tag} ${MAPS[currentMap].name}</div>
    <div id="total-score-bar" style="margin-bottom:10px;">🏆 Total: <span id="total-val">0</span> pts</div>
    <div id="skin-grid"></div>
    <button id="start-btn" onclick="startGame()" style="margin-top:15px;">▶ COMEÇAR</button>
  `;
  ov.style.display = 'flex';
  buildSkinGrid();
  document.querySelectorAll('.skin-card').forEach(c => {
    const lbl = c.querySelector('.skin-label');
    if(lbl && lbl.textContent === selectedSkin.name && isSkinUnlocked(selectedSkin)) c.classList.add('selected');
  });
}

// ══════════════════════════════
//  GAME OVER / UI
// ══════════════════════════════
function showGameOver(){
  setPauseBtnVisible(false);
  const unlocked = addToTotal(score);
  const newlySkins = unlocked.skins || [];
  const newlyMaps = unlocked.maps || [];

  const ov=document.getElementById('overlay');

  let unlockHTML = '';
  const parts = [];
  if(newlySkins.length > 0){
    parts.push(`<span style="font-size:0.7rem;color:#ffe566;font-family:'Nunito',sans-serif;font-weight:900;">✨ SKIN: </span>` +
      newlySkins.map(s=>`<span style="font-size:0.85rem;">${s.tag} ${s.name}</span>`).join(' · '));
  }
  if(newlyMaps.length > 0){
    parts.push(`<span style="font-size:0.7rem;color:#66ccff;font-family:'Nunito',sans-serif;font-weight:900;">🗺️ MAPA: </span>` +
      newlyMaps.map(m=>`<span style="font-size:0.85rem;">${m.tag} ${m.name}</span>`).join(' · '));
  }
  if(parts.length > 0){
    unlockHTML = `<div style="background:rgba(255,229,102,0.12);border:1px solid #ffe566;border-radius:8px;padding:5px 12px;text-align:center;width:100%;">
      ${parts.join('<br>')}
    </div>`;
  }

  const nextSkin = SKINS.find(s => !isSkinUnlocked(s));
  const nextMap = Object.values(MAPS).find(m => !isMapUnlocked(m));
  let progressParts = [];
  if(nextSkin){
    progressParts.push(`Skin: ${nextSkin.tag} ${nextSkin.name} — faltam <span style="color:#ffe566;font-weight:900">${Math.max(0, nextSkin.cost - totalScore).toLocaleString('pt-BR')} pts</span>`);
  }
  if(nextMap){
    progressParts.push(`Mapa: ${nextMap.tag} ${nextMap.name} — faltam <span style="color:#66ccff;font-weight:900">${Math.max(0, nextMap.cost - totalScore).toLocaleString('pt-BR')} pts</span>`);
  }
  const progressHTML = progressParts.length
    ? `<div style="font-family:'Nunito',sans-serif;font-size:0.63rem;color:#555;text-align:center;">${progressParts.join('<br>')}</div>`
    : `<div style="font-family:'Nunito',sans-serif;font-size:0.63rem;color:#ffe566;text-align:center;">🏆 Tudo desbloqueado!</div>`;

  ov.innerHTML=`
    <h1 style="font-size:1.6rem;margin:0;">💀 Fim de Jogo!</h1>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;">
      <span style="font-size:1rem;color:#ffe566;font-family:'Nunito',sans-serif;">🎯 <strong>${score}</strong> pts</span>
      <span style="font-size:0.72rem;color:#666;font-family:'Nunito',sans-serif;">Nível ${level} · ${selectedSkin.name}</span>
      <span style="font-size:0.72rem;color:#888;font-family:'Nunito',sans-serif;">🏆 Total: <strong style="color:#ffe566">${totalScore.toLocaleString('pt-BR')}</strong></span>
      <span style="font-size:0.72rem;color:#999;font-family:'Nunito',sans-serif;">📍 Mapa: ${MAPS[currentMap].tag} ${MAPS[currentMap].name}</span>
    </div>
    ${unlockHTML}
    ${progressHTML}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button id="start-btn" onclick="startGame()" style="background:linear-gradient(135deg,#ff4466,#aa0033);padding:9px 28px;font-size:1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #550011;letter-spacing:1px;flex-shrink:0;">🔄 Jogar Novamente</button>
      <button onclick="showMapSelection()" style="background:linear-gradient(135deg,#4466ff,#0033aa);padding:9px 24px;font-size:1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #001155;letter-spacing:1px;flex-shrink:0;">🗺️ Trocar Mapa</button>
    </div>
    <div id="skin-section" style="width:100%;">
      <h3 style="margin-bottom:3px;">✦ TROCAR SKIN? ✦</h3>
      <div id="total-score-bar">🏆 Total: <span id="total-val">0</span> pts</div>
      <div id="skin-grid"></div>
    </div>
  `;
  ov.style.display='flex';
  buildSkinGrid();
  document.querySelectorAll('.skin-card').forEach(c=>{
    const lbl=c.querySelector('.skin-label');
    if(lbl&&lbl.textContent===selectedSkin.name&&isSkinUnlocked(selectedSkin)) c.classList.add('selected');
  });
}

async function startGame(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('skin-badge').textContent=selectedSkin.tag+' '+selectedSkin.name;
  await initAudio();
  resetGame(); state='play';
  setPauseBtnVisible(true);
  cancelAnimationFrame(animId); loop();
  startBGM();
}

document.getElementById('start-btn').addEventListener('click',startGame);

function setPauseBtnVisible(v){
  const btn = document.getElementById('pause-btn');
  if(!btn) return;
  if(v) btn.classList.add('visible');
  else btn.classList.remove('visible');
}

function showPauseMenu(){
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="font-size:clamp(1.5rem,5vw,2.2rem);color:#ffe566;text-shadow:0 0 30px #ffb800,0 4px 0 #a07000;margin:0;">⏸️ Pausado</h1>
    <div style="font-family:'Nunito',sans-serif;font-size:0.8rem;color:#aaa;margin:4px 0 12px;">
      ${score} pts · Nível ${level} · ${MAPS[currentMap].tag} ${MAPS[currentMap].name}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:280px;">
      <button onclick="resumeGame()" style="width:100%;background:linear-gradient(135deg,#44cc66,#228833);padding:12px 28px;font-size:1.1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #115522;letter-spacing:1px;">▶️ Continuar</button>
      <button onclick="restartFromPause()" style="width:100%;background:linear-gradient(135deg,#ff8866,#cc4422);padding:12px 28px;font-size:1.1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #882200;letter-spacing:1px;">🔄 Reiniciar</button>
      <button onclick="goToMainMenu()" style="width:100%;background:linear-gradient(135deg,#6688ff,#3344aa);padding:12px 28px;font-size:1.1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #112266;letter-spacing:1px;">🏠 Tela Inicial</button>
      <a href="index.html" style="display:block;text-align:center;text-decoration:none;width:100%;background:linear-gradient(135deg,#ff4466,#aa0033);padding:12px 28px;font-size:1.1rem;border:none;border-radius:50px;color:#fff;font-family:'Fredoka One',cursive;box-shadow:0 4px 0 #550011;letter-spacing:1px;">🚪 Sair para o portfólio</a>
    </div>
    <div style="font-family:'Nunito',sans-serif;font-size:0.65rem;color:#555;margin-top:10px;">Esc / P — pausar ou continuar</div>
  `;
  ov.style.display = 'flex';
}

function togglePause(){
  if(state==='play'){
    state = 'paused';
    cancelAnimationFrame(animId);
    // clear held keys so player doesn't keep moving
    Object.keys(keys).forEach(k => keys[k] = false);
    document.querySelectorAll('.ctrl-btn.pressed').forEach(b => b.classList.remove('pressed'));
    showPauseMenu();
    playSound('select', 0.4);
  } else if(state==='paused'){
    resumeGame();
  }
}

function resumeGame(){
  if(state!=='paused') return;
  document.getElementById('overlay').style.display = 'none';
  state = 'play';
  cancelAnimationFrame(animId);
  loop();
  playSound('select', 0.4);
}

function restartFromPause(){
  document.getElementById('overlay').style.display = 'none';
  resetGame();
  state = 'play';
  cancelAnimationFrame(animId);
  loop();
  startBGM();
  playSound('select', 0.5);
}

function exitGame(e){
  // partida em andamento: pausa e confirma antes de sair (evita toque acidental)
  if(state==='play'||state==='paused'){
    if(state==='play') togglePause();
    if(!confirm('Sair do jogo e voltar ao portfólio?\nA partida atual será perdida.')){
      if(e) e.preventDefault();
      return false;
    }
  }
  return true; // segue o link para index.html
}

function goToMainMenu(){
  state = 'menu';
  cancelAnimationFrame(animId);
  stopBGM();
  setPauseBtnVisible(false);
  Object.keys(keys).forEach(k => keys[k] = false);
  showMapSelection();
  playSound('select', 0.5);
}

let muted = false;
function toggleMute(){
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
  if(bgmGain) bgmGain.gain.value = muted ? 0 : 0.22;
  if(!muted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// ══════════════════════════════

// ══════════════════════════════
initStars(); showMapSelection(); draw();
